<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVID JOURNEY</title>
    <!-- Okta Auth SDK -->
    <script src="https://global.oktacdn.com/okta-auth-js/7.4.0/okta-auth-js.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                        url('https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .card {
            background: rgba(18, 24, 38, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 48px 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .logo {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #00e5ff;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 30px;
            margin: 0 0 16px;
            font-weight: 700;
            line-height: 1.2;
        }
        p {
            color: #a0aec0;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #00e5ff;
            border: none;
            border-radius: 12px;
            color: #0d1117;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: #33ebff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">VIVID JOURNEY</div>
        <h1>Crafting Your<br>Perfect Escape.</h1>
        <p>완벽한 휴양을 넘어 삶의 감각을 깨우게 해줄 프리미엄 프라이빗 큐레이션 서비스를 경험해보세요.</p>
        <button class="btn-primary" onclick="handleLogin()">Sign In with Okta</button>
    </div>

    <script>
        const oktaAuth = new OktaAuth({
            issuer: 'https://isd.okta.com/oauth2/default',
            clientId: '0oa17gugbkec3KPTK698',
            redirectUri: 'https://damysone.github.io/ransom-demo-site/welcome.html',
            pkce: true
        });

        function handleLogin() {
            oktaAuth.token.getWithRedirect({
                scopes: ['openid', 'profile', 'email']
            });
        }
    </script>
</body>
</html>
