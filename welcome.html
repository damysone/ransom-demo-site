<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to VIVID JOURNEY</title>
    <!-- Okta Auth SDK -->
    <script src="https://global.oktacdn.com/okta-auth-js/7.4.0/okta-auth-js.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                        url('https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .card {
            background: rgba(18, 24, 38, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 48px 36px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .check-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.12);
            border: 2px solid #00e5ff;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            color: #00e5ff; font-size: 26px; font-weight: bold;
        }
        .badge {
            color: #00e5ff; font-size: 12px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;
        }
        h1 { font-size: 26px; margin: 0 0 16px; font-weight: 700; }
        p.info { color: #a0aec0; font-size: 14px; line-height: 1.6; margin-bottom: 32px; }
        .btn-primary {
            width: 100%; padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; color: #fff; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-bottom: 16px; transition: all 0.2s ease;
        }
        .btn-primary:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-secondary {
            background: none; border: none; color: #718096; font-size: 13px;
            font-weight: 600; letter-spacing: 1px; cursor: pointer;
            text-transform: uppercase; transition: color 0.2s ease;
        }
        .btn-secondary:hover { color: #e2e8f0; }
        #loading { font-size: 15px; color: #a0aec0; }
    </style>
</head>
<body>
    <div class="card" id="card-content">
        <div id="loading">인증 정보를 확인하고 있습니다...</div>
    </div>
<script>
    const oktaAuth = new OktaAuth({
        issuer: 'https://isd.okta.com/oauth2/default',
        clientId: '0oa17gugbkec3KPTK698',
        redirectUri: 'https://damysone.github.io/ransom-demo-site/welcome.html',
        postLogoutRedirectUri: 'https://damysone.github.io/ransom-demo-site/index.html',
        pkce: true
    });

    async function init() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            
            // 1. Authorization Code가 들어왔을 때 처리
            if (urlParams.has('code')) {
                await oktaAuth.handleLoginRedirect();
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // 2. 인증 여부 확인
            const isAuthenticated = await oktaAuth.isAuthenticated();
            if (isAuthenticated) {
                const user = await oktaAuth.getUser();
                renderWelcomeUI(user);
            } else {
                // 토큰 완전히 비우고 index.html로 이동
                window.localStorage.clear();
                window.sessionStorage.clear();
                window.location.replace('index.html');
            }
        } catch (err) {
            console.error("인증 확인 오류:", err);
            window.localStorage.clear();
            window.sessionStorage.clear();
            window.location.replace('index.html');
        }
    }

    function renderWelcomeUI(user) {
        const userName = user.name || user.preferred_username || 'Member';
        const userEmail = user.email || user.sub || '';

        document.getElementById('card-content').innerHTML = `
            <div class="check-icon">✓</div>
            <div class="badge">VERIFIED MEMBER</div>
            <h1>Welcome, ${userName}!</h1>
            <p class="info">
                <strong>${userEmail}</strong> 멤버십 인증이 완료되었습니다.<br><br>
                일상에서 벗어나 당신이 마주할 특별한 여정,<br>
                엄선된 프리미엄 프라이빗 큐레이션이 지금 시작됩니다. ✈️🍹
            </p>
            <button class="btn-primary" onclick="window.location.href='packages.html'">Explore Curated Packages</button>
            <br>
            <button class="btn-secondary" onclick="handleLogout()">SIGN OUT / LOGOUT</button>
        `;
    }

    async function handleLogout() {
        try {
            // 브라우저 내 Okta 토큰 및 세션 정보 완전 삭제
            window.localStorage.clear();
            window.sessionStorage.clear();

            // Okta 서버 로그아웃 호출 (실패하더라도 catch에서 무조건 index.html로 이동)
            await oktaAuth.signOut({
                postLogoutRedirectUri: 'https://damysone.github.io/ransom-demo-site/index.html'
            });
        } catch (e) {
            console.error("로그아웃 처리 중 오류 발생 (강제 이동):", e);
            window.location.replace('index.html');
        }
    }

    init();
</script>
    
</body>
</html>
